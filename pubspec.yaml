name: my_portfolio
description: My Flutter Portfolio
publish_to: "none"
version: 2.0.0

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^16.2.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shimmer: ^3.0.0
  super_banners: ^0.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  generate: true
  uses-material-design: false
  fonts:
    - family: MyPortfolio
      fonts:
        - asset: fonts/MyPortfolio.ttf
